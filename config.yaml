# Non-secret configuration (spec §12).
# Secrets are environment-only and must never appear here — see .env.example (spec §4).

# The two LLM jobs are kept separate (spec §2.4) and have very different cost profiles, so
# each gets its own model. Structured outputs — which make the resolution prompt's JSON
# contract enforceable rather than merely requested — need Sonnet 5 or newer.
#
# models.resolution covers both of resolution's calls: proposing identifiers, and choosing a
# product from the list NVD's dictionary returns. They are one job in two steps, not two jobs.
models:
  resolution: claude-sonnet-5
  research: claude-sonnet-5 # revisit at phase 7; this is the expensive, web-search-backed call

# Toggle any automated source off wholesale. Unknown names are rejected at load.
sources:
  bitsight: true
  nvd: true
  osv: true
  fedramp: true
  caag: true
  # The checklist research call. Billed per assessment and the most expensive thing here
  # (a web search per question), so it is toggleable like any other source.
  llm_research: true

# Checklist categories an analyst fills in out of band (spec §7). These are the permanent
# design for non-automatable categories, not stubs — do not write HTTP clients for them.
#
# DEVIATION FROM SPEC §6: cvedetails is listed there as an automated source. It is a manual
# source here. Its API needs a paid Business/Enterprise subscription, which is exactly the
# "paywalled" case §7 gives as grounds for making something manual, and §7 says adding a
# manual source is a config entry rather than code. Do not write an HTTP client for it.
manual_sources:
  - name: cvedetails
    url: https://www.cvedetails.com
    instruction: "Search the vendor; record CVE counts and anything NVD missed"
  - name: ssllabs
    url: https://www.ssllabs.com/ssltest
    instruction: "Scan the service hostname; record the grade"
  - name: openbugbounty
    url: https://www.openbugbounty.org
    instruction: "Search the vendor domain; record open/fixed counts"

# Per-source cache lifetimes (spec §11). These signals age very differently.
# Manual sources have no TTL and are exempt from expiry — see spec §7.
cache_ttl:
  bitsight: 24h
  nvd: 24h
  osv: 24h
  fedramp: 168h # authorization status changes rarely
  caag: 168h # breach list updates infrequently
  llm_research: 168h # most expensive call in the system
  resolution: 720h # entity mapping is near-static

timeouts:
  per_source: 30s
  # The research call. Was 33-342s before the brevity rule and an explicit effort setting;
  # 22-46s across fifteen runs since. Budgeted at roughly five times the slowest of those,
  # because the old distribution had a long tail and one round of measurements is not proof
  # the tail is gone.
  research: 240s
  # Entity resolution: a model call, one or two reads of NVD's CPE dictionary, and a second
  # model call to pick a product out of what came back. Each dictionary read waits out NVD's
  # six-second unkeyed courtesy interval, so per_source is nowhere near enough — and a
  # resolution timeout kills the assessment, where a source timeout marks one section.
  resolution: 120s
  total: 360s # a ceiling, not a target; manual sources return instantly

nvd:
  results_per_cpe: 20

listen: ":8080"
